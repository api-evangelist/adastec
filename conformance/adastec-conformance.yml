scope: >-
  Corporate management-system certifications ADASTEC publishes on its own site. No API-contract
  conformance (OAuth2/OIDC, JSON:API, RFC 9457, pagination, idempotency, OData, SCIM) could be
  asserted or refuted: ADASTEC publishes no OpenAPI, AsyncAPI, GraphQL SDL or API reference, so
  there is no contract to read. Those checks are recorded as unknown rather than false.
note: >-
