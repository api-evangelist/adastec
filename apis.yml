aid: adastec
name: Adastec
description: >-
  ADASTEC Corp. is an automated-driving software company headquartered in East Lansing, Michigan,
  with offices in Helmond, Netherlands and Istanbul, Turkey. It develops flowride.ai, an SAE Level-4
  automated driving software and sensor platform for full-size commercial vehicles — factory-fitted
  electric buses and minibuses operated on pre-mapped public-road routes. The platform is organized
  as flowride Drive (the on-vehicle automation stack and HMI connector), flowride Cloud (central
  control, data storage, data sharing and what the company markets as an Open API) and flowride Apps
  (remote management, command and control, a passenger application and analytics). Deployments run
  with transit operators and bus OEM partners including Karsan, Beep and Applied Autonomy across the
  United States, Sweden, Norway, Finland, Germany, Switzerland, the Netherlands, Romania and Turkey.
  ADASTEC is a premium member of the Autoware Foundation. No public developer portal, API reference
  or machine-readable contract is published for the flowride Cloud API.
